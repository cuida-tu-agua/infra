# Production: only Caddy (80/443) and Mosquitto (1883) are public. Use it with
# COMPOSE_FILE=compose.yml:compose.prod.yml in the server .env
services:
  sqlserver:
    environment:
      MSSQL_PID: Express                  # free for production
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports: ["127.0.0.1:1433:1433"]        # only through an SSH tunnel
    mem_limit: 2560m

  redis:     { mem_limit: 128m }
  rabbitmq:
    ports: ["127.0.0.1:15672:15672"]      # panel only through an SSH tunnel
    mem_limit: 384m
  mosquitto:
    ports: ["1883:1883"]                  # the meters connect from the Internet
    mem_limit: 64m

  # Producción NO construye: descarga la imagen que Jenkins subió a GHCR.
  # El tag de cada servicio vive en el .env del servidor (Jenkins lo actualiza al desplegar).
  ms-iam:
    image: ghcr.io/cuida-tu-agua/ms-iam:${MS_IAM_TAG:?falta MS_IAM_TAG en .env}
    build: !reset null
    mem_limit: 640m
  ms-places:
    image: ghcr.io/cuida-tu-agua/ms-places:${MS_PLACES_TAG:?falta MS_PLACES_TAG en .env}
    build: !reset null
    mem_limit: 256m
  ms-device:
    image: ghcr.io/cuida-tu-agua/ms-device:${MS_DEVICE_TAG:?falta MS_DEVICE_TAG en .env}
    build: !reset null
    mem_limit: 256m
  ms-consumption:
    image: ghcr.io/cuida-tu-agua/ms-consumption:${MS_CONSUMPTION_TAG:?falta MS_CONSUMPTION_TAG en .env}
    build: !reset null
    mem_limit: 256m
  ms-valve:
    image: ghcr.io/cuida-tu-agua/ms-valve:${MS_VALVE_TAG:?falta MS_VALVE_TAG en .env}
    build: !reset null
    mem_limit: 256m
  ms-notification:
    image: ghcr.io/cuida-tu-agua/ms-notification:${MS_NOTIFICATION_TAG:?falta MS_NOTIFICATION_TAG en .env}
    build: !reset null
    mem_limit: 256m
  api-gateway:
    image: ghcr.io/cuida-tu-agua/api-gateway:${API_GATEWAY_TAG:?falta API_GATEWAY_TAG en .env}
    build: !reset null
    mem_limit: 512m
  web:
    image: ghcr.io/cuida-tu-agua/web:${WEB_TAG:?falta WEB_TAG en .env}
    build: !reset null
    mem_limit: 64m

  # Container admin panel: only through an SSH tunnel (ssh -L 9443:127.0.0.1:9443 ...)
  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    mem_limit: 192m
    ports: ["127.0.0.1:9443:9443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api-gateway
      - web
      - swagger-ui

volumes:
  caddy-data:
  caddy-config:
  portainer-data:
