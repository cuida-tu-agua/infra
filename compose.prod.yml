# Production: only Caddy (80/443) and Mosquitto (1883) are public. Use it with
# COMPOSE_FILE=compose.yml:compose.prod.yml in the server .env
services:
  sqlserver:
    environment:
      MSSQL_PID: Express                  # free for production
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports: ["127.0.0.1:1433:1433"]        # only through an SSH tunnel
    mem_limit: 2560m

  redis:     { mem_limit: 128m }
  rabbitmq:
    ports: ["127.0.0.1:15672:15672"]      # panel only through an SSH tunnel
    mem_limit: 384m
  mosquitto:
    ports: ["1883:1883"]                  # the meters connect from the Internet
    mem_limit: 64m

  ms-iam:          { mem_limit: 640m }
  ms-places:       { mem_limit: 256m }
  ms-device:       { mem_limit: 256m }
  ms-consumption:  { mem_limit: 256m }
  ms-valve:        { mem_limit: 256m }
  ms-notification: { mem_limit: 256m }
  api-gateway:     { mem_limit: 512m }
  web:             { mem_limit: 64m }

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api-gateway
      - web

volumes:
  caddy-data:
  caddy-config:
