name: cuidatuagua

# ── Migrations: one sqlcmd container and one Liquibase container per *-db repo ──
x-init-env: &init-env
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

x-db-init: &db-init
  image: mcr.microsoft.com/mssql/server:2022-latest
  profiles: ["migrate"]
  restart: "no"
  # Same call as the sqlserver-init service of every *-db repo, with the variable names passed in
  command:
    - /bin/bash
    - -c
    - >
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -d master -C -b
      -v $$APP_VAR="$$APP_PASSWORD" -v $$MIGRATOR_VAR="$$MIGRATOR_PASSWORD"
      -i /init/00-init.sql

x-lb-env: &lb-env
  LIQUIBASE_COMMAND_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=sy-water-db;encrypt=true;trustServerCertificate=true"

x-liquibase: &liquibase
  image: liquibase/liquibase:4.29
  profiles: ["migrate"]
  restart: "no"
  command: >
    --defaultsFile=/workspace/liquibase.properties
    --searchPath=/workspace
    --changeLogFile=changelog/db.changelog-master.yaml
    update

# ── Health checks ──────────────────────────────────────────────────────────────────
# The .NET and Java images have no curl: bash opens a TCP socket, sends GET and expects "200"
# in the status line. The /health endpoints also check the database (and MQTT in ms-devices).
x-health-timing: &health-timing
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 60s

# ── Settings shared by the five .NET services ────────────────────────────────────
x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_gcServer: "0"                       # workstation GC: less memory per process
  Jwt__Issuer: https://iam.cuidatuagua.local # same value as iam.jwt.issuer in ms-iam
  Redis__Configuration: redis:6379
  Internal__ApiKey: ${INTERNAL_API_KEY}
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__Username: sywater
  RabbitMq__Password: ${RABBITMQ_PASSWORD}

x-dotnet: &dotnet
  restart: unless-stopped
  healthcheck:
    <<: *health-timing
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${ASPNETCORE_HTTP_PORTS} && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
  volumes:
    - ${KEYS_DIR}/public.pem:/app/keys/iam-public.pem:ro
  depends_on:
    sqlserver: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  # ═══ Infrastructure ═══════════════════════════════════════════════════════════
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Healthy only when EVERY database is ONLINE (SELECT 1 alone passes while sy-water-db is still recovering)
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -Q \"IF EXISTS (SELECT 1 FROM sys.databases WHERE state_desc <> 'ONLINE') RAISERROR('databases still starting', 16, 1)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: sywater
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ═══ Services ═════════════════════════════════════════════════════════════════
  ms-iam:
    build: ../sy-water-backend/ms-iam
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=sy-water-db;encrypt=true;trustServerCertificate=true"
      SECURITY_APP_PASSWORD: ${SECURITY_APP_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DEVICES_URL: http://ms-device:3003
      PLACES_URL: http://ms-places:3002
      NOTIFICATIONS_URL: http://ms-notification:3006   # HU-028: delivers the phone verification code (SMS / WhatsApp)
      IAM_CORSALLOWEDORIGINS: ""             # the gateway answers CORS
      OPENAPI_ENABLED: "true"                # publish /v3/api-docs (read by swagger-ui)
      IAM_OPENAPI_SERVER_URL: /iam
      SPRING_MAIL_HOST: ${SMTP_HOST}
      SPRING_MAIL_PORT: ${SMTP_PORT}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTH}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS}
      IAM_MAIL_FROM: "Cuida Tu Agua <${SMTP_FROM}>"
      IAM_MAIL_APP_URL: ${APP_PUBLIC_URL}
      # HU-004 "Continuar con Google" (empty id/secret = the button is hidden)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${PUBLIC_API_URL}/iam/api/auth/google/callback
      GOOGLE_ALLOWED_REDIRECTS: ${APP_PUBLIC_URL},${GOOGLE_EXTRA_REDIRECTS:-saveyourwater:,exp:}
    volumes:
      - ${KEYS_DIR}/public.pem:/app/keys/public.pem:ro
      - ${KEYS_DIR}/private.pem:/app/keys/private.pem:ro
      - iam-avatars:/app/uploads
    healthcheck:
      <<: *health-timing
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3001 && printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
    depends_on:
      sqlserver: { condition: service_healthy }
      redis: { condition: service_healthy }

  ms-places:
    <<: *dotnet
    build: ../sy-water-backend/ms-places
    environment:
      <<: *dotnet-env
      ASPNETCORE_HTTP_PORTS: "3002"
      OpenApi__Enabled: "true"               # publish /openapi/v1.json (read by swagger-ui)
      OpenApi__ServerUrl: /places
      ConnectionStrings__Places: "Server=sqlserver,1433;Database=sy-water-db;User Id=places_app;Password=${PLACES_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Services__DevicesBaseUrl: http://ms-device:3003
      Services__ConsumptionBaseUrl: http://ms-consumption:3004
      Services__IamBaseUrl: http://ms-iam:3001
      App__BaseUrl: ${APP_PUBLIC_URL}

  ms-device:
    <<: *dotnet
    build: ../sy-water-backend/ms-devices
    environment:
      <<: *dotnet-env
      ASPNETCORE_HTTP_PORTS: "3003"
      OpenApi__Enabled: "true"               # publish /openapi/v1.json (read by swagger-ui)
      OpenApi__ServerUrl: /devices
      ConnectionStrings__Devices: "Server=sqlserver,1433;Database=sy-water-db;User Id=devices_app;Password=${DEVICES_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Services__PlacesBaseUrl: http://ms-places:3002
      Mqtt__Host: mosquitto
      Mqtt__Port: "1883"
      Mqtt__Username: ms-devices
      Mqtt__Password: ${MQTT_MS_DEVICES_PASSWORD}
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      mosquitto: { condition: service_healthy }

  ms-consumption:
    <<: *dotnet
    build: ../sy-water-backend/ms-consumption
    environment:
      <<: *dotnet-env
      ASPNETCORE_HTTP_PORTS: "3004"
      OpenApi__Enabled: "true"               # publish /openapi/v1.json (read by swagger-ui)
      OpenApi__ServerUrl: /consumption
      ConnectionStrings__Consumption: "Server=sqlserver,1433;Database=sy-water-db;User Id=consumption_app;Password=${CONSUMPTION_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Services__PlacesBaseUrl: http://ms-places:3002

  ms-valve:
    <<: *dotnet
    build: ../sy-water-backend/ms-valve
    environment:
      <<: *dotnet-env
      ASPNETCORE_HTTP_PORTS: "3005"
      OpenApi__Enabled: "true"               # publish /openapi/v1.json (read by swagger-ui)
      OpenApi__ServerUrl: /valve
      ConnectionStrings__Valve: "Server=sqlserver,1433;Database=sy-water-db;User Id=valve_app;Password=${VALVE_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Services__IamBaseUrl: http://ms-iam:3001
      Services__PlacesBaseUrl: http://ms-places:3002
      Services__DevicesBaseUrl: http://ms-device:3003

  ms-notification:
    <<: *dotnet
    build: ../sy-water-backend/ms-notifications
    environment:
      <<: *dotnet-env
      ASPNETCORE_HTTP_PORTS: "3006"
      OpenApi__Enabled: "true"               # publish /openapi/v1.json (read by swagger-ui)
      OpenApi__ServerUrl: /notifications
      ConnectionStrings__Notification: "Server=sqlserver,1433;Database=sy-water-db;User Id=notification_app;Password=${NOTIFICATION_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Services__IamBaseUrl: http://ms-iam:3001
      Services__PlacesBaseUrl: http://ms-places:3002
      App__PublicUrl: ${APP_PUBLIC_URL}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__Security: ${SMTP_SECURITY}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromAddress: ${SMTP_FROM}
      Smtp__FromName: Cuida Tu Agua
      # HU-028 SMS / WhatsApp: twilio (server) · mailpit (local, see compose.override.yml) · empty = off
      Sms__Provider: ${SMS_PROVIDER:-}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Twilio__SmsFrom: ${TWILIO_SMS_FROM:-}
      Twilio__WhatsAppFrom: ${TWILIO_WHATSAPP_FROM:-}

  # ═══ Entry points ═════════════════════════════════════════════════════════════
  api-gateway:
    build: ../sy-water-backend/api-gateway
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      REDIS_HOST: redis
      IAM_URL: http://ms-iam:3001
      PLACES_URL: http://ms-places:3002
      DEVICES_URL: http://ms-device:3003
      CONSUMPTION_URL: http://ms-consumption:3004
      VALVE_URL: http://ms-valve:3005
      NOTIFICATIONS_URL: http://ms-notification:3006
      IAM_PUBLIC_KEY: file:/keys/public.pem
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS}
    volumes:
      - ${KEYS_DIR}/public.pem:/keys/public.pem:ro
    healthcheck:
      <<: *health-timing
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
    depends_on:
      redis: { condition: service_healthy }
      ms-iam: { condition: service_healthy }
      ms-places: { condition: service_healthy }
      ms-device: { condition: service_healthy }
      ms-consumption: { condition: service_healthy }
      ms-valve: { condition: service_healthy }
      ms-notification: { condition: service_healthy }

  web:
    build:
      context: ../sy-water-frontend/save-your-water
      args:
        EXPO_PUBLIC_API_URL: ${PUBLIC_API_URL}/iam
        EXPO_PUBLIC_PLACES_API_URL: ${PUBLIC_API_URL}/places
        EXPO_PUBLIC_DEVICES_API_URL: ${PUBLIC_API_URL}/devices
        EXPO_PUBLIC_CONSUMPTION_API_URL: ${PUBLIC_API_URL}/consumption
        EXPO_PUBLIC_VALVE_API_URL: ${PUBLIC_API_URL}/valve
        EXPO_PUBLIC_NOTIFICATIONS_API_URL: ${PUBLIC_API_URL}/notifications
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api-gateway: { condition: service_healthy }
  
  # ═══ API documentation ══════════════════════════════════════════════════════════
  # One Swagger UI for the six services; the documents are read through the gateway.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    restart: unless-stopped
    environment:
      BASE_URL: /docs
      URLS: >-
        [{"name":"ms-iam","url":"${PUBLIC_API_URL}/iam/v3/api-docs"},
         {"name":"ms-places","url":"${PUBLIC_API_URL}/places/openapi/v1.json"},
         {"name":"ms-device","url":"${PUBLIC_API_URL}/devices/openapi/v1.json"},
         {"name":"ms-consumption","url":"${PUBLIC_API_URL}/consumption/openapi/v1.json"},
         {"name":"ms-valve","url":"${PUBLIC_API_URL}/valve/openapi/v1.json"},
         {"name":"ms-notification","url":"${PUBLIC_API_URL}/notifications/openapi/v1.json"}]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/docs/"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api-gateway: { condition: service_healthy }

  # ═══ Database migrations (profile "migrate") ═════════════════════════════════
  # Each repo: 1) 00-init.sql creates its schema and users, 2) Liquibase applies the changelog.
  # They run in a chain, in the same order as in local development (ms-iam-db creates the database).
  init-iam:
    <<: *db-init
    environment: { <<: *init-env, APP_VAR: SECURITY_APP_PASSWORD, APP_PASSWORD: "${SECURITY_APP_PASSWORD}", MIGRATOR_VAR: SECURITY_MIGRATOR_PASSWORD, MIGRATOR_PASSWORD: "${SECURITY_MIGRATOR_PASSWORD}" }
    volumes: ["../sy-water-db/ms-iam-db/sqlserver-init:/init:ro"]
    depends_on: { sqlserver: { condition: service_healthy } }
  lb-iam:
    <<: *liquibase
    environment: { <<: *lb-env, LIQUIBASE_COMMAND_USERNAME: security_migrator, LIQUIBASE_COMMAND_PASSWORD: "${SECURITY_MIGRATOR_PASSWORD}" }
    volumes: ["../sy-water-db/ms-iam-db:/workspace"]
    depends_on: { init-iam: { condition: service_completed_successfully } }

  init-places:
    <<: *db-init
    environment: { <<: *init-env, APP_VAR: PLACES_APP_PASSWORD, APP_PASSWORD: "${PLACES_APP_PASSWORD}", MIGRATOR_VAR: PLACES_MIGRATOR_PASSWORD, MIGRATOR_PASSWORD: "${PLACES_MIGRATOR_PASSWORD}" }
    volumes: ["../sy-water-db/ms-places-db/sqlserver-init:/init:ro"]
    depends_on: { lb-iam: { condition: service_completed_successfully } }
  lb-places:
    <<: *liquibase
    environment: { <<: *lb-env, LIQUIBASE_COMMAND_USERNAME: places_migrator, LIQUIBASE_COMMAND_PASSWORD: "${PLACES_MIGRATOR_PASSWORD}" }
    volumes: ["../sy-water-db/ms-places-db:/workspace"]
    depends_on: { init-places: { condition: service_completed_successfully } }

  init-device:
    <<: *db-init
    environment: { <<: *init-env, APP_VAR: DEVICES_APP_PASSWORD, APP_PASSWORD: "${DEVICES_APP_PASSWORD}", MIGRATOR_VAR: DEVICES_MIGRATOR_PASSWORD, MIGRATOR_PASSWORD: "${DEVICES_MIGRATOR_PASSWORD}" }
    volumes: ["../sy-water-db/ms-device-db/sqlserver-init:/init:ro"]
    depends_on: { lb-places: { condition: service_completed_successfully } }
  lb-device:
    <<: *liquibase
    environment: { <<: *lb-env, LIQUIBASE_COMMAND_USERNAME: devices_migrator, LIQUIBASE_COMMAND_PASSWORD: "${DEVICES_MIGRATOR_PASSWORD}" }
    volumes: ["../sy-water-db/ms-device-db:/workspace"]
    depends_on: { init-device: { condition: service_completed_successfully } }

  init-consumption:
    <<: *db-init
    environment: { <<: *init-env, APP_VAR: CONSUMPTION_APP_PASSWORD, APP_PASSWORD: "${CONSUMPTION_APP_PASSWORD}", MIGRATOR_VAR: CONSUMPTION_MIGRATOR_PASSWORD, MIGRATOR_PASSWORD: "${CONSUMPTION_MIGRATOR_PASSWORD}" }
    volumes: ["../sy-water-db/ms-consumption-db/sqlserver-init:/init:ro"]
    depends_on: { lb-device: { condition: service_completed_successfully } }
  lb-consumption:
    <<: *liquibase
    environment: { <<: *lb-env, LIQUIBASE_COMMAND_USERNAME: consumption_migrator, LIQUIBASE_COMMAND_PASSWORD: "${CONSUMPTION_MIGRATOR_PASSWORD}" }
    volumes: ["../sy-water-db/ms-consumption-db:/workspace"]
    depends_on: { init-consumption: { condition: service_completed_successfully } }

  init-valve:
    <<: *db-init
    environment: { <<: *init-env, APP_VAR: VALVE_APP_PASSWORD, APP_PASSWORD: "${VALVE_APP_PASSWORD}", MIGRATOR_VAR: VALVE_MIGRATOR_PASSWORD, MIGRATOR_PASSWORD: "${VALVE_MIGRATOR_PASSWORD}" }
    volumes: ["../sy-water-db/ms-valve-db/sqlserver-init:/init:ro"]
    depends_on: { lb-consumption: { condition: service_completed_successfully } }
  lb-valve:
    <<: *liquibase
    environment: { <<: *lb-env, LIQUIBASE_COMMAND_USERNAME: valve_migrator, LIQUIBASE_COMMAND_PASSWORD: "${VALVE_MIGRATOR_PASSWORD}" }
    volumes: ["../sy-water-db/ms-valve-db:/workspace"]
    depends_on: { init-valve: { condition: service_completed_successfully } }

  init-notification:
    <<: *db-init
    environment: { <<: *init-env, APP_VAR: NOTIFICATION_APP_PASSWORD, APP_PASSWORD: "${NOTIFICATION_APP_PASSWORD}", MIGRATOR_VAR: NOTIFICATION_MIGRATOR_PASSWORD, MIGRATOR_PASSWORD: "${NOTIFICATION_MIGRATOR_PASSWORD}" }
    volumes: ["../sy-water-db/ms-notification-db/sqlserver-init:/init:ro"]
    depends_on: { lb-valve: { condition: service_completed_successfully } }
  lb-notification:
    <<: *liquibase
    environment: { <<: *lb-env, LIQUIBASE_COMMAND_USERNAME: notification_migrator, LIQUIBASE_COMMAND_PASSWORD: "${NOTIFICATION_MIGRATOR_PASSWORD}" }
    volumes: ["../sy-water-db/ms-notification-db:/workspace"]
    depends_on: { init-notification: { condition: service_completed_successfully } }

  # The last link: "docker compose --profile migrate up -d migrate" runs the whole chain
  migrate:
    image: busybox:1.36
    profiles: ["migrate"]
    command: ["echo", "All migrations applied"]
    depends_on: { lb-notification: { condition: service_completed_successfully } }


volumes:
  sqlserver-data:
  redis-data:
  rabbitmq-data:
  mosquitto-data:
  iam-avatars:
